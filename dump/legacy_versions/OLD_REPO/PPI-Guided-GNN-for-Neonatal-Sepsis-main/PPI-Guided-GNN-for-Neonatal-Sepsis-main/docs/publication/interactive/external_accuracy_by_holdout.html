<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <script src="https://cdn.plot.ly/plotly-2.27.0.min.js"></script>
</head>
<body>
  <div id="chart" style="width:100%;height:600px;"></div>
  <script>
    const data = {"x": ["GSE160207", "GSE163812", "GSE180838", "GSE186141"], "y1": [0.5833333333333334, 0.5, 0.3333333333333333, 0.75], "y2": [0.4166666666666667, 0.5, 0.3333333333333333, 0.25], "y1_label": "GAT", "y2_label": "LR", "y_label": "Accuracy", "title": "External Accuracy by Holdout"};
    const traces = [];
    traces.push({x: data.x, y: data.y1, type: 'bar', name: data.y1_label});
    if (data.y2) {
      traces.push({x: data.x, y: data.y2, type: 'bar', name: data.y2_label});
    }
    const layout = {title: data.title, barmode: data.y2 ? 'group' : 'overlay', yaxis: {title: data.y_label}};
    Plotly.newPlot('chart', traces, layout);
  </script>
</body>
</html>
